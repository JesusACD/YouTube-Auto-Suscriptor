<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YouTube Auto Suscriptor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      font-size: 24px;
      color: #cc0000;
      margin-bottom: 15px;
    }
    textarea {
      width: 100%;
      height: 200px;
      margin-bottom: 15px;
      padding: 10px;
      resize: vertical;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #cc0000;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }
    button:hover {
      background-color: #990000;
    }
    button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }
    #status {
      margin-top: 15px;
      color: #333;
      font-size: 16px;
    }
    .progress {
      margin-top: 15px;
      display: none;
    }
    .progress-bar {
      height: 12px;
      background-color: #f0f0f0;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      background-color: #cc0000;
      width: 0%;
      transition: width 0.3s;
    }
    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    #extract-button {
      background-color: #065fd4;
    }
    #extract-button:hover {
      background-color: #0450b5;
    }
    #extract-button:disabled {
      background-color: #999;
    }
    #copy-button {
      background-color: #2e7d32;
      display: none;
      margin-top: 10px;
    }
    #copy-button:hover {
      background-color: #1b5e20;
    }
    #extraction-status {
      margin-top: 10px;
      color: #065fd4;
      font-style: italic;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <h1>YouTube Auto Suscriptor</h1>
  
  <p>Ingresa las URLs de los canales de YouTube (una por línea):</p>
  <textarea id="channel-urls" placeholder="https://www.youtube.com/@NombreCanal&#10;https://www.youtube.com/@OtroCanal"></textarea>
  
  <div class="button-group">
    <button id="subscribe-button">Suscribirse a Canales</button>
    <button id="extract-button">📋 Extraer Mis Suscripciones</button>
  </div>
  <button id="copy-button">📎 Copiar URLs al Portapapeles</button>
  
  <div id="status"></div>
  <div id="extraction-status"></div>
  
  <div class="progress">
    <p>Progreso: <span id="progress-text">0/0</span></p>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>
  
  <script src="index.js"></script>
</body>
</html>
