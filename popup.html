<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YouTube Auto Suscriptor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 320px;
      padding: 10px;
    }
    h1 {
      font-size: 18px;
      color: #cc0000;
      margin-bottom: 15px;
    }
    textarea {
      width: 100%;
      height: 150px;
      margin-bottom: 10px;
      padding: 5px;
      resize: vertical;
    }
    button {
      background-color: #cc0000;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #990000;
    }
    button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      color: #333;
    }
    .progress {
      margin-top: 10px;
      display: none;
    }
    .progress-bar {
      height: 10px;
      background-color: #f0f0f0;
      border-radius: 5px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background-color: #cc0000;
      width: 0%;
      transition: width 0.3s;
    }
    .button-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    #extract-button {
      background-color: #065fd4;
    }
    #extract-button:hover {
      background-color: #0450b5;
    }
    #extract-button:disabled {
      background-color: #999;
    }
    #copy-button {
      background-color: #2e7d32;
      display: none;
      margin-top: 8px;
    }
    #copy-button:hover {
      background-color: #1b5e20;
    }
    #extraction-status {
      margin-top: 8px;
      color: #065fd4;
      font-style: italic;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>YouTube Auto Suscriptor</h1>
  
  <p>Ingresa las URLs de los canales de YouTube (una por línea):</p>
  <textarea id="channel-urls" placeholder="https://www.youtube.com/@NombreCanal&#10;https://www.youtube.com/@OtroCanal"></textarea>
  
  <div class="button-group">
    <button id="subscribe-button">Suscribirse a Canales</button>
    <button id="extract-button">📋 Extraer Mis Suscripciones</button>
  </div>
  <button id="copy-button">📎 Copiar URLs al Portapapeles</button>
  
  <div id="status"></div>
  <div id="extraction-status"></div>
  
  <div class="progress">
    <p>Progreso: <span id="progress-text">0/0</span></p>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    <p id="current-url-status" style="margin-top: 5px; font-style: italic; color: #555;"></p>
  </div>

  <div id="results-container" style="display: none; margin-top: 15px;">
    <h3>Resultados del Proceso</h3>
    <div id="successful-results">
      <h4>Suscripciones Exitosas</h4>
      <ul id="successful-list"></ul>
    </div>
    <div id="failed-results" style="margin-top: 10px;">
      <h4>Suscripciones Fallidas</h4>
      <ul id="failed-list"></ul>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
